<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Subir Recuerdo - Bautizo Mateo</title>
</head>
<body>
    <h1>Sube tu foto para el Bautizo de Mateo</h1>
    
    <form id="uploadForm">
        <input type="file" id="archivoInput" accept="image/*,video/*" required><br><br>
        <button type="submit">Subir Recuerdo</button>
    </form>

    <p id="mensaje"></p>

    <script>
        const form = document.getElementById('uploadForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const archivoInput = document.getElementById('archivoInput').files[0];
            const mensaje = document.getElementById('mensaje');

            if (!archivoInput) return;

            const formData = new FormData();
            formData.append('archivo', archivoInput);
            // AQUÍ ES DONDE CAMBIAS EL NOMBRE DEL EVENTO SEGÚN EL CLIENTE:
            formData.append('evento', 'BAUTIZO MATEO');

            mensaje.textContent = 'Subiendo, por favor espera...';

            try {
                // Cambia esta URL por la URL real que te dé Render de tu servidor
                const response = await fetch('https://TU-SERVIDOR-EN-RENDER.onrender.com/subir-recuerdo', {
                    method: 'POST',
                    body: formData
                });

                const resultado = await response.json();
                if (resultado.success) {
                    mensaje.textContent = '¡Foto subida con éxito!';
                } else {
                    mensaje.textContent = 'Error: ' + resultado.error;
                }
            } catch (err) {
                console.error(err);
                mensaje.textContent = 'Hubo un error de conexión con el servidor.';
            }
        });
    </script>
</body>
</html>
